name: Backend hiring regressions

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
  push:
    paths: ['backend/**', '.github/workflows/backend-tests.yml']

permissions:
  contents: read

jobs:
  hiring:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coral_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coral_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coral_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coral_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run test:typecheck
      - run: npm test -- --runInBand
      - run: npm run test:e2e
